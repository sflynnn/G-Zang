name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  mobile-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/mobile
        run: npm ci

      - name: Run ESLint
        working-directory: ./apps/mobile
        run: npm run lint || true

      - name: Run TypeScript type check
        working-directory: ./apps/mobile
        run: npm run type-check || true

      - name: Run unit tests
        working-directory: ./apps/mobile
        run: npm run test || true

  pc-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [pc-main, pc-personal, pc-business, pc-admin]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ./apps/${{ matrix.app }}
        run: npm ci

      - name: Run ESLint
        working-directory: ./apps/${{ matrix.app }}
        run: npm run lint || true

      - name: Type check
        working-directory: ./apps/${{ matrix.app }}
        run: npm run type-check || true

      - name: Build
        working-directory: ./apps/${{ matrix.app }}
        run: npm run build || true

  build-all:
    runs-on: ubuntu-latest
    needs: [mobile-test, pc-test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build mobile
        run: |
          cd apps/mobile && npm ci && npm run build

      - name: Build PC main
        run: |
          cd apps/pc-main && npm ci && npm run build

      - name: Build PC personal
        run: |
          cd apps/pc-personal && npm ci && npm run build

      - name: Build PC business
        run: |
          cd apps/pc-business && npm ci && npm run build

      - name: Build PC admin
        run: |
          cd apps/pc-admin && npm ci && npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-builds
          path: |
            apps/mobile/dist
            apps/pc-main/dist
            apps/pc-personal/dist
            apps/pc-business/dist
            apps/pc-admin/dist
          retention-days: 7
