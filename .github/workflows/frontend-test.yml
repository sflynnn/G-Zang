name: Frontend Test & Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/**'
      - 'packages/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/**'
      - 'packages/**'

env:
  NODE_VERSION: '20'

jobs:
  # 移动端测试
  mobile-test:
    name: Mobile App Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run type-check

      - name: Run Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run E2E Tests (if configured)
        run: npm run test:e2e || echo "E2E tests not configured"
        continue-on-error: true

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: apps/mobile/coverage/lcov.info
          flags: mobile
          name: mobile-coverage

  # PC 个人端测试
  pc-personal-test:
    name: PC Personal Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./apps/pc-personal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/pc-personal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run type-check

      - name: Run Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit || echo "No tests configured"

  # PC 企业端测试
  pc-business-test:
    name: PC Business Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./apps/pc-business

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/pc-business/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run type-check

      - name: Run Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit || echo "No tests configured"

  # PC 管理端测试
  pc-admin-test:
    name: PC Admin Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./apps/pc-admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/pc-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check
        run: npm run type-check

      - name: Run Lint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit || echo "No tests configured"

  # 前端构建
  build:
    name: Build All Apps
    runs-on: ubuntu-latest
    needs: [mobile-test, pc-personal-test, pc-business-test, pc-admin-test]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build Mobile
        run: npm run build:mobile
        working-directory: ./apps/mobile

      - name: Build PC Personal
        run: npm run build
        working-directory: ./apps/pc-personal

      - name: Build PC Business
        run: npm run build
        working-directory: ./apps/pc-business

      - name: Build PC Admin
        run: npm run build
        working-directory: ./apps/pc-admin

      - name: Build PC Main
        run: npm run build
        working-directory: ./apps/pc-main

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-builds
          path: |
            apps/mobile/dist
            apps/pc-personal/dist
            apps/pc-business/dist
            apps/pc-admin/dist
            apps/pc-main/dist
          retention-days: 7
